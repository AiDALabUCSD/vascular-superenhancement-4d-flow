name: unet_dual_head

# Dual-head model for simultaneous cine enhancement + phase error correction
# Input: temporal mag window + 3 uncorrected velocity channels
# Output: 1 enhanced cine + 3 phase error correction fields = 4 channels

model_type: "dual_head"  # Signals build_generator to use DualHeadGenerator
upsample_mode: "trilinear"  # "deconv" (transpose conv) or "trilinear" (interpolation + conv)

# Input channels = len(temporal_mag_offsets) + 1 (center mag) + 3 (velocity)
# For offsets [-2, -1, 1, 2]: 5 + 3 = 8
# For offsets [-1, 1]: 3 + 3 = 6
# For offsets []: 1 + 3 = 4
in_channels: 6

# Shared backbone (MONAI UNet)
shared_features: 32  # UNet out_channels, shared feature dim fed to both heads
channels: [32, 64, 128, 256, 512]  # 5 encoder levels (deeper than patch-based 4-level)
strides: [2, 2, 2, 2]  # Bottleneck at 8x8x4 for 128x128x64 input
num_res_units: 0
activation: "PReLU"

# Output heads
cine_out_channels: 1       # Enhanced cine (sigmoid activation)
correction_out_channels: 3  # Phase error correction vx, vy, vz (tanh activation)
head_features: 32           # Intermediate conv channels in cine head
head_depth: 2               # Number of intermediate conv layers in cine head (before final 1x1)

# Correction branch (coarse prediction → trilinear upsample)
# Omit these keys to fall back to head_features / head_depth.
correction_head_features: 32      # Feature width for pre-processing block
correction_pre_depth: 1           # Number of full-resolution conv blocks before downsampling
correction_down_features: [64, 64]  # Feature widths for each stride-2 downsample stage
correction_num_downsamples: 2     # Number of stride-2 downsample stages

# Loss weights
# Dual-task baseline: cine enhancement + phase error correction trained
# jointly. The cine weights here are the calibrated values that were in
# use before the brief "correction-only" detour; they roughly balance
# the four cine terms against the (much smaller) raw correction MSE
# once each is multiplied through.
#
# Correction weight map composition (applied inside the trainer):
#   w_voxel = 1 + α_tissue · tissue_mask · radial_factor(r)
# where ``radial_factor(r) = 1 + α_radial · f(r)`` is an in-plane cylinder
# (constant along the slice axis W) built from the chosen profile. Setting
# ``α_tissue = 0`` disables tissue upweighting entirely; setting
# ``α_radial = 0`` (or ``correction_radial_profile: none``) disables the
# radial component and recovers the original ``1 + α_tissue · m`` map.
weights:
  l1_cine: 100.0              # Weight for masked L1 loss on cine enhancement
  ssim_cine: 1.0              # Weight for bbox SSIM loss on cine enhancement
  sobel_cine: 10.0            # Weight for masked Sobel edge loss on cine enhancement
  l1_outside_mask: 10.0       # Weight for outside-mask L1 (mag passthrough regulariser)
  mse_correction: 10000.0     # Weight for MSE loss on phase error corrections
  correction_mask_upweight: 9 # α_tissue: tissue baseline → 10× air
  # --- Radial in-plane upweight (multiplicative, only inside tissue) ---
  correction_radial_upweight: 9      # α_radial: center radial factor = 1 + α_radial = 10×
  correction_radial_profile: gaussian  # one of: gaussian | linear | quadratic | none
  correction_radial_sigma: 0.6         # std of normalised radius (gaussian profile only)

# Optimizer parameters
optimizer:
  name: "Adam"
  lr: 0.0001
  betas: [0.9, 0.999]
