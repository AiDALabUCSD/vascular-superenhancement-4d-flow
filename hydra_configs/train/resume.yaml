# Debug parameters------------------------------------------------------------------------------------------------

debug: false  # Enable debug logging

# Data parameters------------------------------------------------------------------------------------------------

# patch parameters
patch_size: [96,96,48]  # Size of 3D patches for training
patch_overlap: 0  # Overlap between patches for inference (can be 0 for no overlap)
patch_aggregation_overlap_mode: "hann"  # Mode for patch overlap (can be "crop" or "hann" or "average")

# queue parameters
queue_length: 1000  # Length of the patch queue
samples_per_volume: 8  # Number of patches to sample per volume
num_queue_workers: 8  # Number of workers for patch sampling
num_loader_workers: 0  # Number of workers for data loading
shuffle_subjects: true  # Shuffle subjects in the dataset
shuffle_patches: true  # Shuffle patches in the queue
pin_memory: true  # Pin memory for faster data transfer
timepoints_as_augmentation: true  # Whether to use timepoints as augmentation

# training parameters------------------------------------------------------------------------------------------------

batch_size: 32  # Batch size for training
num_epochs: 1000  # Number of training epochs
lambda_gan: 1.0  # Weight for GAN loss
lambda_l1: 100.0  # Weight for L1 loss
lambda_ssim: 1.0  # Weight for SSIM loss

# validation, checkpointing, and early stopping parameters------------------------------------------------------------------------------------------------
discriminator_update_threshold: 0  # Threshold for discriminator update. 0 means update every batch.
num_sample_predictions: -1  # Number of sample predictions for visualization. -1 means all subjects.
early_stop_patience: 700  # Number of epochs to wait before early stopping
early_stop_metric: "val/loss_generator"  # Metric to monitor for early stopping
early_stop_threshold: 0.33  # Threshold for early stopping
early_stop_mode: "min"  # Mode for early stopping (min or max)
validation_time_index: 0  # Time index for validation

validation_inference:
  patient_ids: ["Heruemey"]  # Patients to visualize during validation without contributing to metrics
  time_index: null  # Optional override for time index; defaults to validation_time_index when null

visualization_save_original: true  # Save original images for visualization
visualization_save_frequency: 10  # Save visualization every n epochs
checkpoint_interval: 10  # Save checkpoint every n epochs
checkpoint_path: /home/ayeluru/vascular-superenhancement-4d-flow/working_dir/all_patients/runs/2025-11-07/17-45-17/checkpoints/epoch_0630.pt  # Optional: path to checkpoint file to load at start of training
resume_from_checkpoint_epoch: false  # If true, resume from checkpoint epoch; if false, load weights but start from epoch 0

# augmentation parameters------------------------------------------------------------------------------------------------

# Gamma augmentation
log_gamma_min: -0.5  # Minimum gamma value
log_gamma_max: 0.5  # Maximum gamma value
gamma_probability: 0.5  # Probability of applying gamma augmentation

# Elastic deformation
num_control_points: [15,15,5]  # Number of control points for elastic deformation
max_displacement: [10,10,5]  # Maximum displacement for elastic deformation
elastic_deformation_probability: 0.5  # Probability of applying elastic deformation

# Sphere inversion augmentation (patch-level)
sphere_inversion_probability: 0.5  # Probability of applying sphere inversion augmentation to each patch
sphere_inversion_radius_min: 20  # Minimum sphere radius in voxels
sphere_inversion_radius_max: 40  # Maximum sphere radius in voxels
sphere_inversion_alpha: 1.0  # Alpha blending factor (0-1), where 1.0 means fully inverted, 0.0 means original
sphere_inversion_center_jitter: 20  # Maximum jitter from patch center in voxels