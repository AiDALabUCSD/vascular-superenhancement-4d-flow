# Dual-task training configuration
# Full-volume (128x128x64) downsampled data, no patching
# Simultaneous cine enhancement + phase error correction

# Debug parameters
debug: false
debug_max_train_patients: null
# Optional explicit subsets, useful for smoke tests where you want to
# deliberately mix subjects (e.g. with/without cine).  When set, these
# take precedence over ``debug_max_train_patients``.
debug_train_patient_ids: null
debug_validation_patient_ids: null

# Training mode
trainer_type: "dual_task"

# Temporal magnitude offsets
# List of offsets from center timepoint for additional mag frames
# Center timepoint is always implicitly included
# Examples: [-1, 1] for window of 3, [-2, -1, 1, 2] for window of 5
temporal_mag_offsets: [-1, 1]

# Data parameters (no patching)
num_timepoints: 20

# Dataloader parameters (standard DataLoader, no Queue/UniformSampler)
batch_size: 16
num_loader_workers: 8
prefetch_factor: 4
pin_memory: true
timepoints_as_augmentation: false  # Epoch-based validation

# Training parameters
num_epochs: 70
num_gpus: 2  # Ignored when using DDP (torchrun controls GPU count)
use_amp: true  # Mixed precision (FP16) for faster training and lower memory
grad_clip_max_norm: 500.0  # Max gradient norm for clipping

# Validation, checkpointing, and early stopping
# Monitor the combined (cine + correction) loss. Patience of 15 means we
# stop if val/loss_generator hasn't improved for 15 consecutive
# validation epochs.
num_sample_predictions: -1
early_stop_patience: 15
early_stop_metric: "val/loss_generator"
early_stop_min_delta: 0.0
early_stop_mode: "min"
validation_time_index: 0

# Patients to visualize predictions for that are NOT in the validation split
# These patients don't need cine/correction ground truth -- only inputs (mag + velocity)
visualization_patient_ids: ["Heruemey"]

visualization_save_original: true
visualization_save_frequency: 10

# In-loop aortic/pulmonary flow validation (FlowValidationCallback).
# Reconstructs the model-corrected velocity on the downsampled grid for a few
# validation patients and measures Ao / PA / Qp:Qs against the GT-corrected and
# uncorrected fields, using the precomputed auto-flow geometry. Requires the
# per-patient geometry cache (scripts/scale_flow_geometry.sh); patients without
# it are skipped. Disabled by default -- flip ``enabled`` to turn it on.
# Patients dropped from the TRAINING set due to corrupt correction targets
# (isolated >VENC speckle in the 4d_flow_diff_* field, confirmed via
# scripts/scan_correction_targets.py). Full known-bad set: Liegeje, Siquojie,
# Miquegop. Starting with Liegeje only (the dominant spike driver, 2.27x loss
# inflation) to isolate its effect before excluding the others.
exclude_train_patient_ids: ["Liegeje"]

# Per-batch structured logging for spike forensics. Writes one CSV row per
# training batch per rank (batch_metrics/train_batch_metrics_rank{R}.csv) tagged
# with the patient IDs in that batch, and emits a live WARNING when the watched
# metric exceeds running mean + k*std so spikes can be traced to specific patients.
batch_metrics:
  enabled: true
  # Metrics watched for live spike WARNINGs (each gets its own rolling window):
  #   loss_correction_mse     - weighted correction (Charbonnier) term
  #   loss_generator          - total loss (catches cine-side spikes)
  #   metric_grad_norm        - actual update magnitude (flags CLIPPED too)
  #   loss_correction_mse_vz  - through-plane channel (most flow-relevant)
  spike_metrics: [loss_correction_mse, loss_generator, metric_grad_norm, loss_correction_mse_vz]
  spike_k: 5.0                # warn when value > running mean + k*std
  spike_window: 100           # rolling window for the running statistics
  spike_min_count: 20         # min samples before spike detection arms
  nan_alarm_after_step: 50    # suppress NaN/Inf alarm during AMP warmup

flow_validation:
  enabled: false
  every_n_epochs: 10        # measure at this cadence (plus the final epoch)
  run_on_first_epoch: true  # also measure at epoch 0 for a baseline
  num_patients: -1          # number of validation patients to measure (-1 = all)
  patient_ids: null         # explicit override, e.g. ["Alernscet", "Beborep"]
  # Patients with known-broken auto-flow geometry (flipped plane normals -> negative
  # flow). Still measured + written to the CSV, but dropped from aggregate metrics.
  exclude_patient_ids: ["Curintod", "Farare"]
  seg_threshold: 0.0        # drop plane pixels never segmented (0.0 = exact)
  # Hold each patient's STATIC model inputs (uncorrected velocity + magnitude
  # frames) in RAM across epochs. Strongly recommended when measuring many
  # patients: without it every flow epoch re-reads ~80 cold gzip NIfTI frames per
  # patient, which dominates the runtime (the first, cache-warming epoch pays this
  # regardless; later epochs then become nearly pure GPU). Nothing is written to
  # disk. Defaults on; set false only if RAM is tight (~250 MB velocity +
  # ~80 MB magnitude per patient, so ~12 GB for all 36 usable patients).
  cache_uncorrected_in_ram: true
  log_to_wandb: true
  csv: true

checkpoint_interval: 10
checkpoint_monitor_metrics:
  - "val/loss_cine_l1"
  - "val/loss_generator"
  - "val/loss_correction_mse"
checkpoint_path: null
resume_from_checkpoint_epoch: false

# Augmentation parameters

# Gamma augmentation (applied to mag images only)
log_gamma_min: -0.5
log_gamma_max: 0.5
gamma_probability: 0

# Elastic deformation (applied to all spatial images)
num_control_points: [12, 12, 5]
max_displacement: [10, 10, 5]
elastic_deformation_probability: 0

# No sphere inversion (was patch-level, not meaningful at full-volume scale)
